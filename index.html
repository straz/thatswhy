<!doctype html>
<!--
  thatswhy.dev — parametric marble run.
  URL params (all optional):
    mode=lr|td   left-to-right or top-down (default: from aspect ratio)
    n=3          number of start points
    m=2          number of end points
    seed=123     layout seed (default: random per visit)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>thatswhy.dev: Keep up with the surprises</title>
<meta name="description" content="The faster decisions get made, the more it&#8217;s worth keeping track of the &#8220;why&#8221; behind them.">
<link rel="icon" href="longreach-logo.svg" type="image/svg+xml">
<link rel="icon" href="logo.ico" sizes="128x128">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="base" aria-hidden="true"></canvas>
<canvas id="c" aria-hidden="true"></canvas>
<!-- brass name plaque on the front of the box; positioned by layout() -->
<div class="plaque">
  <a class="logo" href="https://longreach.ai" title="Longreach"><img src="longreach-logo.svg" alt="Longreach"></a>
  <div>
    <h1>thatswhy<span class="dev">.dev</span></h1>
    <p class="motto">infrastructure for <span>causality ops</span></p>
  </div>
</div>
<!-- front-panel controls; positioned by layout() -->
<div class="controls">
  <button class="reset" type="button" title="Reset the machine" aria-label="Reset the machine">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 3.5v4.5h-4.5"/></svg>
  </button>
  <div class="modes" role="group" aria-label="Mode">
    <button class="mode" type="button" data-scenario="ai-capex" aria-pressed="true">AI CAPEX</button>
    <button class="mode" type="button" data-scenario="staffing" aria-pressed="false">STAFFING</button>
    <button class="mode" type="button" data-scenario="medical" aria-pressed="false">MEDICAL</button>
  </div>
</div>
<footer class="about">
  <p class="tagline">Keep up with the surprises</p>
  <p>The faster decisions get made, the more it&#8217;s worth keeping track of the <em>why</em> behind them.</p>
  <p><a href="mailto:info@longreach.ai">[Talk to us]</a>
    <a href="https://api.thatswhy.dev/mcp">[Talk to our MCP]</a>
  </p>
</footer>
<!-- slips falling out of the box, over the text below it -->
<canvas id="fly" aria-hidden="true"></canvas>
<script src="js/util.js"></script>
<script src="js/theme.js"></script>
<script src="js/layout.js"></script>
<script src="js/marbles.js"></script>
<script src="js/elements.js"></script>
<script src="js/endpoints.js"></script>
<script src="js/render.js"></script>
<script src="js/tags.js"></script>
<script src="js/slips.js"></script>
<script src="js/conditions.js"></script>
<script src="js/statuses.js"></script>
<script src="js/box.js"></script>
<script src="js/controls.js"></script>
<script src="js/build.js"></script>
<script src="js/main.js"></script>
</body>
</html>
