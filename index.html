<!doctype html>
<!--
  thatswhy.dev — parametric marble run.
  URL params (all optional):
    mode=lr|td   left-to-right or top-down (default: from aspect ratio)
    n=3          number of start points
    m=2          number of end points
    seed=123     layout seed (default: random per visit)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>thatswhy.dev: Keep up with the surprises</title>
<meta name="description" content="The faster decisions get made, the more it&#8217;s worth keeping track of the &#8220;why&#8221; behind them.">
<link rel="icon" href="longreach-logo.svg" type="image/svg+xml">
<link rel="icon" href="logo.ico" sizes="128x128">
<style>
  :root { --bg: #f4efe6; --ink: #3b3631; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181c; --ink: #d9d4cc; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .mark {
    position: fixed; left: 16px; right: 16px; top: 10px; margin: 0;
    display: grid; grid-template-columns: 26px 1fr; column-gap: 8px; align-items: start;
    color: var(--ink); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .mark .logo { display: block; line-height: 0; margin-top: -3px; }
  .mark img { width: 26px; height: 26px; }
  .mark h1 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; letter-spacing: .02em; }
  .mark .name { white-space: nowrap; }
  .mark .dev { opacity: .55; }
  .mark .tag { font-weight: 500; opacity: .8; white-space: nowrap; }
  .mark p { margin: 4px 0 0; max-width: 80em; font-size: 12px; line-height: 1.4; opacity: .65; }
  @media (max-width: 480px) { .mark h1 { font-size: 14px; } }
  @media (prefers-color-scheme: dark) { .mark img { filter: invert(1); } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<header class="mark">
  <a class="logo" href="https://longreach.ai" title="Longreach"><img src="longreach-logo.svg" alt="Longreach"></a>
  <div>
    <h1><span class="name">thatswhy<span class="dev">.dev</span>:</span> <span class="tag">Keep up with the surprises</span></h1>
    <p>The faster decisions get made, the more it&#8217;s worth keeping track of the &#8220;why&#8221; behind them.  <a href="https://api.thatswhy.dev/mcp">[MCP]</a></p>
  </div>
</header>
<script>
(() => {
'use strict';

const TAU = Math.PI * 2;
const params = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const seed = parseInt(params.get('seed'), 10) || Math.floor(Math.random() * 1e9);

// ---------- utilities ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${clamp(l, 0, 100)}%,${a})`;

function mulberry32(a) {
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function linePts(a, b, n = 8) {
  const out = [];
  for (let i = 0; i <= n; i++) out.push([lerp(a[0], b[0], i / n), lerp(a[1], b[1], i / n)]);
  return out;
}
// cubic bezier from p0 (leaving along d0) to p3 (arriving along d3)
function bezPts(p0, d0, p3, d3, k0, k3, n = 28) {
  const p1 = [p0[0] + d0[0] * k0, p0[1] + d0[1] * k0], p2 = [p3[0] - d3[0] * k3, p3[1] - d3[1] * k3];
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, mt = 1 - t, a = mt * mt * mt, b = 3 * mt * mt * t, c = 3 * mt * t * t, d = t * t * t;
    out.push([a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0], a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]]);
  }
  return out;
}
function offsetPts(pts, d) {
  return pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    return [p[0] - dy / l * d, p[1] + dx / l * d];
  });
}
function roundRect(g, x, y, w, h, rad) {
  rad = Math.min(rad, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function circle(g, x, y, rad) { g.beginPath(); g.arc(x, y, rad, 0, TAU); }

// ---------- themes ----------
const THEMES = {
  light: {
    bg: '#f4efe6', dot: 'rgba(90,70,40,0.08)', shadow: 'rgba(80,55,30,0.13)', shRGB: '70,48,25', shA: 0.3,
    rim: '#e6dccb', rimHi: '#efe7d9', edge: 'rgba(80,55,30,0.2)', groove: '#d6c8b1', grooveIn: '#ddd0bb',
    rail: '#a8977f', tie: '#d4c6ae',
    mint: '#a3dac7', mintDk: '#5fae94', coral: '#f4a48f', coralDk: '#d9765f',
    butter: '#f6d886', butterLt: '#fbe9b5', butterDk: '#d4a640', lav: '#c9bbef', lavDk: '#8e7bcf',
    pink: '#f5a3bb', pinkDk: '#e07094',
    ringHi: '#eceef2', ringLo: '#9aa0aa', hole: '#1a1b1f', blade0: '#5d626c', blade1: '#858a94', seam: 'rgba(20,22,26,0.55)',
    ink: '#3b3631', tagBg: 'rgba(244,239,230,0.88)', tagLit: '#e0708f',
    paper: '#fffdf6', paperLine: 'rgba(80,120,200,0.18)', paperInk: '#3b3631', brassHi: '#e6c97f', brassLo: '#b08a3e'
  },
  dark: {
    bg: '#16181c', dot: 'rgba(255,255,255,0.045)', shadow: 'rgba(0,0,0,0.35)', shRGB: '0,0,0', shA: 0.5,
    rim: '#2a2e35', rimHi: '#323740', edge: 'rgba(0,0,0,0.5)', groove: '#1f2228', grooveIn: '#24282e',
    rail: '#626a77', tie: '#2f343c',
    mint: '#5aa58d', mintDk: '#3d7a66', coral: '#c87a66', coralDk: '#9c5545',
    butter: '#c9a650', butterLt: '#dcc07a', butterDk: '#97782f', lav: '#8a7cc0', lavDk: '#5e5197',
    pink: '#c97790', pinkDk: '#99506a',
    ringHi: '#8d939d', ringLo: '#40454d', hole: '#000', blade0: '#3a3f47', blade1: '#5a606a', seam: 'rgba(0,0,0,0.6)',
    ink: '#d9d4cc', tagBg: 'rgba(22,24,28,0.85)', tagLit: '#f08fae',
    paper: '#ece6d8', paperLine: 'rgba(80,120,200,0.22)', paperInk: '#2e2a26', brassHi: '#b89a55', brassLo: '#7d6229'
  }
};

// ---------- marble materials ----------
const MATS = [
  { name: 'silver', kind: 'metal', h: 215, s: 8, l: 70 },
  { name: 'gold', kind: 'metal', h: 44, s: 72, l: 58 },
  { name: 'copper', kind: 'metal', h: 20, s: 60, l: 56 },
  { name: 'ruby', kind: 'glass', h: 350, s: 80, l: 52 },
  { name: 'emerald', kind: 'glass', h: 150, s: 65, l: 44 },
  { name: 'sapphire', kind: 'glass', h: 220, s: 80, l: 54 },
  { name: 'amber', kind: 'glass', h: 35, s: 90, l: 54 },
  { name: 'amethyst', kind: 'glass', h: 280, s: 55, l: 58 },
  { name: 'aqua', kind: 'glass', h: 185, s: 70, l: 50 },
  { name: 'jade', kind: 'stone', h: 150, s: 32, l: 56 },
  { name: 'lapis', kind: 'stone', h: 225, s: 55, l: 42 },
  { name: 'terracotta', kind: 'stone', h: 15, s: 52, l: 56 },
  { name: 'granite', kind: 'stone', h: 30, s: 8, l: 62 }
];
function pickMat(cur) {
  const choices = MATS.filter(x => x.name !== 'silver' && x.name !== cur.name);
  return choices[Math.floor(Math.random() * choices.length)];
}
function blendMat(a, b) {
  let h;
  if (a.s < 12) h = b.h; else if (b.s < 12) h = a.h;
  else {
    const ra = a.h * Math.PI / 180, rb = b.h * Math.PI / 180;
    h = Math.round((Math.atan2(Math.sin(ra) + Math.sin(rb), Math.cos(ra) + Math.cos(rb)) * 180 / Math.PI + 360) % 360);
  }
  return { name: 'blend', kind: a.kind === b.kind ? a.kind : 'glass', h, s: Math.max(a.s, b.s, 40), l: (a.l + b.l) / 2 };
}

// ---------- state ----------
let W, H, dpr, mode, F, C;
let L, s, r, Rs, w, K, V0, U1, uSrc, uSink, speed, cap;
let srcLanes, sinkLanes, grid, elements, sources, sinks, sinkAt, marbles, particles, notes, layerA, layerB, rng, theme;
let nextId = 1, now = 0;

const laneV = i => V0 + s * (i + 0.5);
const colU = col => U1 + (col - 1) * w;
const toScreen = (u, v) => mode === 'lr' ? [u, v] : [v, u];
const localVec = (x, y) => mode === 'lr' ? [x, y] : [y, x];
function setLocal(g) {
  if (mode === 'lr') g.setTransform(dpr, 0, 0, dpr, 0, 0);
  else g.setTransform(0, dpr, dpr, 0, 0, 0);
}
function spread(n, total) {
  return Array.from({ length: n }, (_, k) => Math.min(total - 1, Math.floor((k + 0.5) * total / n)));
}
function nearestSink(i) {
  let best = sinkLanes[0];
  for (const j of sinkLanes) if (Math.abs(j - i) < Math.abs(best - i)) best = j;
  return best;
}

function layout() {
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
  const pm = params.get('mode');
  // phones (touch screen, small short side) always run top-down, even in landscape
  const mobile = matchMedia('(pointer: coarse)').matches && Math.min(W, H) < 600;
  mode = pm === 'lr' || pm === 'td' ? pm : mobile || W < H * 1.05 ? 'td' : 'lr';
  F = mode === 'lr' ? W : H; C = mode === 'lr' ? H : W;
  const mC = Math.max(16, C * 0.06), mF = Math.max(30, F * 0.05);
  // keep the machine clear of the header in the top-left corner
  const top = document.querySelector('.mark').getBoundingClientRect().bottom + 8;
  const mCtop = mode === 'lr' ? Math.max(mC, top) : mC, mFtop = mode === 'td' ? Math.max(mF, top) : mF;
  const crossAvail = C - mC - mCtop;
  L = clamp(Math.floor(crossAvail / clamp(C / 6, 62, 100)), 3, mobile ? 5 : 8);
  s = Math.min(crossAvail / L, 115);
  const N = clamp(parseInt(params.get('n'), 10) || (mobile ? 2 : 3), 1, L);
  const M = clamp(parseInt(params.get('m'), 10) || 2, 1, L);
  srcLanes = spread(N, L); sinkLanes = spread(M, L);
  let jump = 0;
  for (let i = 0; i < L; i++) jump = Math.max(jump, Math.abs(i - nearestSink(i)));
  // on short flows (e.g. a phone held sideways), shrink lanes until two element columns fit
  for (let tries = 0; ; tries++) {
    r = clamp(s * 0.155, 4, 14);
    Rs = r * 1.25;
    uSrc = mFtop + Rs * 1.2;
    U1 = uSrc + Math.max(3 * r, 0.45 * s);
    uSink = F - mF - Rs * 1.2;
    const ucol = uSink - Math.max(1.1 * s, jump * s * 0.85 + 0.6 * s);
    if (ucol - U1 >= 3 * s || tries >= 20) {
      K = Math.max(1, Math.floor((ucol - U1) / (1.5 * s)));
      w = (ucol - U1) / K;
      break;
    }
    s *= 0.9;
  }
  V0 = mCtop + (crossAvail - L * s) / 2;
  speed = s * 1.7;
  cap = clamp(L + 5, 8, 13);
}

// ---------- paths ----------
class Path {
  constructor(pts, o) {
    this.pts = pts;
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    this.cum = cum; this.len = cum[cum.length - 1];
    this.p0 = 0; this.p1 = 1; this.elev = []; this.hfn = null; this.hopElev = false; this.events = [];
    this.src = null; this.onEnd = null; this.scale = null; this.dark = null; this.gap = null; this.style = 'channel';
    Object.assign(this, o);
  }
  idx(sv) {
    let lo = 0, hi = this.cum.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (this.cum[mid] <= sv) lo = mid; else hi = mid; }
    return lo;
  }
  at(sv) {
    sv = clamp(sv, 0, this.len);
    const i = this.idx(sv), a = this.pts[i], b = this.pts[i + 1] || a;
    const t = (sv - this.cum[i]) / ((this.cum[i + 1] - this.cum[i]) || 1);
    return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
  }
  slice(a, b) {
    const out = [this.at(a)];
    for (let i = 0; i < this.pts.length; i++) if (this.cum[i] > a && this.cum[i] < b) out.push(this.pts[i]);
    out.push(this.at(b));
    return out;
  }
  h(sv) { return this.hfn ? this.hfn(sv) : 0; }
  isElev(sv) {
    for (const [a, b] of this.elev) if (sv >= a && sv <= b) return true;
    return this.hopElev && this.h(sv) > 0.15;
  }
  prog(sv) { return this.p0 + (this.p1 - this.p0) * (this.len ? sv / this.len : 1); }
}

// ---------- marbles ----------
function makeMarble(u, v, mat) {
  const specks = [];
  for (let i = 0; i < 9; i++) specks.push({ a: Math.random() * TAU, d: Math.sqrt(Math.random()) * 0.8, z: 0.07 + Math.random() * 0.1, k: Math.random() < 0.5 ? -1 : 1 });
  return {
    id: nextId++, u, v, mat, path: null, s: 0, evi: 0, prog: 0, held: true, solid: true, visible: true,
    scale: 1, dark: 0, h: 0, elev: false, roll: Math.random() * TAU, clip: null, dead: false, pop: null, specks, tags: [], dir: [1, 0]
  };
}
function setPath(m, P) {
  m.path = P; m.s = 0; m.evi = 0;
  [m.u, m.v] = P.at(0);
  m.prog = P.p0; m.elev = P.isElev(0); m.h = P.h(0);
  m.scale = P.scale ? P.scale(0) : 1; m.dark = P.dark ? P.dark(0) : 0;
}
function handoff(m, col, lane) {
  const e = grid[col][lane];
  e.enter(m, lane);
  if (e.tag) { m.tags.push(e.tag); e.lit = now; }
}
function clearAt(u, v, d) {
  return !marbles.some(m => !m.dead && (m.u - u) ** 2 + (m.v - v) ** 2 < d * d);
}
// is o in front of m, judged by m's direction of travel?
const inFront = (m, o) => m.dir[0] * (o.u - m.u) + m.dir[1] * (o.v - m.v) > 0;
function blocked(m, nu, nv, nel) {
  const lim = (2.05 * r) ** 2;
  const dl = Math.hypot(nu - m.u, nv - m.v) || 1;
  m.dir = [(nu - m.u) / dl, (nv - m.v) / dl];
  for (const o of marbles) {
    if (o === m || o.dead || !o.solid || o.elev !== nel) continue;
    const dn = (o.u - nu) ** 2 + (o.v - nv) ** 2;
    if (dn >= lim || !inFront(m, o)) continue;
    // two marbles converging on a merge: the one further along goes first
    if (!o.held && inFront(o, m) && (m.prog > o.prog || (m.prog === o.prog && m.id < o.id))) continue;
    return true;
  }
  return false;
}
function stepMarbles(dt) {
  marbles.sort((a, b) => b.prog - a.prog || a.id - b.id);
  for (const m of marbles) {
    if (m.dead || m.held || !m.path) continue;
    const P = m.path;
    if (m.s < P.len) {
      const ns = Math.min(P.len, m.s + speed * dt);
      const [nu, nv] = P.at(ns), nel = P.isElev(ns);
      if (!blocked(m, nu, nv, nel)) {
        m.roll += (ns - m.s) / r;
        m.s = ns; m.u = nu; m.v = nv; m.elev = nel; m.h = P.h(ns); m.prog = P.prog(ns);
        m.scale = P.scale ? P.scale(ns) : 1; m.dark = P.dark ? P.dark(ns) : 0;
        while (m.evi < P.events.length && P.events[m.evi].at <= m.s) P.events[m.evi++].fn(m);
      }
    }
    if (m.s >= P.len && P.onEnd && m.path === P) P.onEnd(m);
  }
  marbles = marbles.filter(m => !m.dead);
}

// ---------- particles ----------
function burst(u, v, mat, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = s * (0.5 + Math.random() * 1.1);
    particles.push({ u, v, vu: Math.cos(a) * sp, vv: Math.sin(a) * sp, life: 1, h: mat.h + (Math.random() - 0.5) * 60, sat: Math.max(mat.s, 50), l: 68 });
  }
}
function stepParticles(dt) {
  for (const p of particles) { p.u += p.vu * dt; p.v += p.vv * dt; p.vu *= 1 - 3 * dt; p.vv *= 1 - 3 * dt; p.life -= dt * 1.7; }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles(g) {
  for (const p of particles) {
    const z = r * 0.42 * p.life;
    g.fillStyle = hsl(p.h, p.sat, p.l, p.life);
    g.beginPath();
    g.moveTo(p.u, p.v - z); g.quadraticCurveTo(p.u, p.v, p.u + z, p.v);
    g.quadraticCurveTo(p.u, p.v, p.u, p.v + z); g.quadraticCurveTo(p.u, p.v, p.u - z, p.v);
    g.quadraticCurveTo(p.u, p.v, p.u, p.v - z);
    g.fill();
  }
}

// ---------- elements ----------
class Elem {
  constructor(col, a, n) {
    this.col = col; this.a = a; this.n = n;
    this.u0 = colU(col); this.u1 = colU(col + 1); this.uc = (this.u0 + this.u1) / 2; this.wd = this.u1 - this.u0;
    this.vmid = laneV(a + (n - 1) / 2); this.paths = []; this.tag = null; this.lit = -9;
  }
  tagPos() { return [this.uc, laneV(this.a) - 0.4 * s]; }
  P(pts, o) { const p = new Path(pts, o); this.paths.push(p); return p; }
  out(lane) { return m => handoff(m, this.col + 1, lane); }
  lv(k) { return laneV(this.a + k); }
  // which lanes can carry marbles out, given the live input lanes
  outs(live) { return [...live]; }
  lanes() { return Array.from({ length: this.n }, (_, k) => this.a + k); }
  enter() {} update() {} drawBase() {} drawUnder() {} drawOver() {}
}

// straight or wiggly track
class Track extends Elem {
  constructor(col, a, wiggle) {
    super(col, a, 1);
    const v = this.lv(0), A = wiggle ? 0.2 * s * (rng() < 0.5 ? -1 : 1) : 0, pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      pts.push([lerp(this.u0, this.u1, t), v + A * Math.sin(TAU * t) * Math.sin(Math.PI * t)]);
    }
    this.p = this.P(pts, { p0: col, p1: col + 1, onEnd: this.out(a) });
  }
  enter(m) { setPath(m, this.p); }
}

// loop-the-loop on wire rails
class Loop extends Elem {
  constructor(col, a) {
    super(col, a, 1);
    const v = this.lv(0), span = this.wd * 0.7, lead = (this.wd - span) / 2;
    const A = span / TAU, B = 2.6 * A, c = 0.44 * s * (rng() < 0.5 ? -1 : 1);
    let lo = 0.01, hi = Math.PI;
    for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (A * mid < B * Math.sin(mid)) lo = mid; else hi = mid; }
    const d = lo, n = 120, pts = [[this.u0, v]], th = [0];
    for (let i = 0; i <= n; i++) {
      const t = TAU * i / n;
      pts.push([this.u0 + lead + A * t + B * Math.sin(t), v + c * (1 - Math.cos(t)) / 2]);
      th.push(t);
    }
    pts.push([this.u1, v]); th.push(TAU);
    const p = this.P(pts, { p0: col, p1: col + 1, onEnd: this.out(a), style: 'rails' });
    const sAt = t => p.cum[th.findIndex(x => x >= t)];
    p.elev = [[sAt(Math.PI + d - 0.5), sAt(Math.PI + d + 0.5)]];
    const h0 = sAt(Math.PI - d - 0.6), h1 = sAt(Math.PI + d + 0.6);
    p.hfn = sv => sv <= h0 || sv >= h1 ? 0 : Math.sin(Math.PI * (sv - h0) / (h1 - h0)) * 0.45;
    this.p = p;
  }
  enter(m) { setPath(m, this.p); }
}

// trampoline hop over a gap
class Bounce extends Elem {
  constructor(col, a) {
    super(col, a, 1);
    const v = this.lv(0);
    const p = this.P(linePts([this.u0, v], [this.u1, v], 30), { p0: col, p1: col + 1, onEnd: this.out(a), hopElev: true });
    const A = p.len * 0.22, B = p.len * 0.8;
    p.hfn = sv => sv <= A || sv >= B ? 0 : Math.sin(Math.PI * (sv - A) / (B - A)) * 0.9;
    p.gap = [A + 0.5 * r, B - 0.5 * r];
    p.events = [{ at: A, fn: () => { this.hit[0] = now; } }, { at: B, fn: () => { this.hit[1] = now; } }];
    this.pads = [this.u0 + A, this.u0 + B]; this.v = v; this.hit = [-9, -9]; this.p = p;
  }

      const pw = 1.0 * r * (1 - 0.4 * sq), ph = 3.0 * r * (1 + 0.12 * sq), x = this.pads[k];
      g.fillStyle = theme.shadow; roundRect(g, x - pw / 2 + so[0], this.v - ph / 2 + so[1], pw, ph, pw * 0.45); g.fill();
      g.fillStyle = theme.coral; roundRect(g, x - pw / 2, this.v - ph / 2, pw, ph, pw * 0.45); g.fill();
      g.strokeStyle = theme.coralDk; g.lineWidth = 0.12 * r; g.stroke();
      g.beginPath(); g.moveTo(x, this.v - ph * 0.32); g.lineTo(x, this.v + ph * 0.32); g.stroke();
    }
  }
}

// changer: rainbow prism that transmutes the marble
class Changer extends Elem {
  constructor(col, a) {
    super(col, a, 1);
    this.v = this.lv(0); this.flash = -9;
    const p = this.P(linePts([this.u0, this.v], [this.u1, this.v], 30), { p0: col, p1: col + 1, onEnd: this.out(a) });
    p.events = [{ at: p.len / 2, fn: m => { m.mat = pickMat(m.mat); burst(m.u, m.v, m.mat, 14); this.flash = now; } }];
    this.p = p;
  }
  enter(m) { setPath(m, this.p); }
  drawOver(g) {
    const x = this.uc, y = this.v, pw = 0.9 * r, ph = 3.5 * r, dt = now - this.flash;
    if (dt < 0.5) {
      g.strokeStyle = `rgba(255,255,255,${0.8 * (1 - dt * 2)})`; g.lineWidth = 0.2 * r;

    }
    const gr = g.createLinearGradient(x, y - ph / 2, x, y + ph / 2);
    for (let i = 0; i <= 6; i++) gr.addColorStop(i / 6, hsl(i * 55, 85, 68, 0.78));
    g.fillStyle = gr; roundRect(g, x - pw / 2, y - ph / 2, pw, ph, pw * 0.4); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 0.12 * r; g.stroke();
  }
}

// crossover: two gated lanes swap, one over a bridge
class Cross extends Elem {
  constructor(col, a) {
    super(col, a, 2);
    const ug = this.u0 + 0.22 * this.wd, ue = this.u1 - 0.1 * this.wd;
    this.ug = ug; this.wait = [null, null]; this.since = [0, 0]; this.openT = [-9, -9];
    this.inP = [0, 1].map(k => this.P(linePts([this.u0, this.lv(k)], [ug, this.lv(k)], 8),
      { p0: col, p1: col + 0.3, src: this.a + k, onEnd: m => this.arrive(m, k) }));
    this.xP = [0, 1].map(k => {
      const v0 = this.lv(k), v1 = this.lv(1 - k), d = (ue - ug) * 0.5;
      const pts = bezPts([ug, v0], [1, 0], [ue, v1], [1, 0], d, d, 40).concat(linePts([ue, v1], [this.u1, v1], 6).slice(1));
      const p = this.P(pts, { p0: col + 0.3, p1: col + 1, src: this.a + k, onEnd: this.out(this.a + 1 - k) });
      if (k === 1) {
        const ea = p.len * 0.2, eb = p.len * 0.68;
        p.elev = [[ea, eb]];
        p.hfn = sv => sv <= ea || sv >= eb ? 0 : 0.25 * Math.sin(Math.PI * (sv - ea) / (eb - ea));
      }
      return p;
    });
  }
  outs(live) { return [...live].map(l => 2 * this.a + 1 - l); }
  enter(m, lane) { setPath(m, this.inP[lane - this.a]); }
  arrive(m, k) { if (this.wait[k]) return; this.wait[k] = m; m.held = true; this.since[k] = now; }
  release(k) { const m = this.wait[k]; this.wait[k] = null; m.held = false; setPath(m, this.xP[k]); this.openT[k] = now; }
  update() {
    if (this.wait[0] && this.wait[1]) { this.release(0); this.release(1); return; }
    for (let k = 0; k < 2; k++) if (this.wait[k] && now - this.since[k] > 1.4) this.release(k);
  }
  drawUnder(g) {
    for (let k = 0; k < 2; k++) {
      const dt = now - this.openT[k];
      const o = dt < 0.12 ? dt / 0.12 : dt < 0.7 ? 1 : Math.max(0, 1 - (dt - 0.7) / 0.25);
      const x = this.ug + 1.4 * r, y = this.lv(k) + (k ? 1 : -1) * easeInOut(o) * 2.4 * r;
      g.fillStyle = theme.lavDk; roundRect(g, x - 0.28 * r, y - 1.35 * r, 0.56 * r, 2.7 * r, 0.28 * r); g.fill();
    }
  }
}

// clone box: one in, two out
class Clone extends Elem {
  constructor(col, a) {
    super(col, a, 2);
    this.hw = 0.27 * this.wd; this.hh = 0.48 * s;
    this.I = [this.uc - 0.1 * this.wd, this.vmid];
    this.O = [0, 1].map(k => [this.uc + 0.1 * this.wd, lerp(this.vmid, this.lv(k), 0.62)]);
    this.inP = [0, 1].map(k => {
      const d = (this.I[0] - this.u0) * 0.5;
      return this.P(bezPts([this.u0, this.lv(k)], [1, 0], this.I, [1, 0], d, d, 24), { p0: col, p1: col + 0.4, src: this.a + k, onEnd: m => this.arrive(m) });
    });
    this.outP = [0, 1].map(k => {
      const d = (this.u1 - this.O[k][0]) * 0.5;
      return this.P(bezPts(this.O[k], [1, 0], [this.u1, this.lv(k)], [1, 0], d, d, 24), { p0: col + 0.6, p1: col + 1, onEnd: this.out(this.a + k) });
    });
    this.busy = null; this.t0 = -9; this.done = -9;
  }
  outs() { return this.lanes(); }
  enter(m, lane) { setPath(m, this.inP[lane - this.a]); }
  arrive(m) { if (this.busy) return; this.busy = m; m.held = true; this.t0 = now; }
  update() {
    const m = this.busy;
    if (!m || now - this.t0 < 0.9) return;
    if (!this.O.every(o => clearAt(o[0], o[1], 2.1 * r))) return;
    const k = Math.random() < 0.5 ? 0 : 1;
    m.held = false; setPath(m, this.outP[k]);
    if (marbles.length < cap) {
      const c = makeMarble(this.O[1 - k][0], this.O[1 - k][1], m.mat);
      c.held = false; c.tags = m.tags.slice(); setPath(c, this.outP[1 - k]); marbles.push(c);
    }
    burst(this.uc + this.hw, this.vmid, m.mat, 8);
    this.busy = null; this.done = now;
  }
  drawOver(g) {
    const busy = !!this.busy, so = localVec(2, 4);
    const pulse = now - this.done < 0.3 ? 1 + 0.08 * Math.sin((now - this.done) / 0.3 * Math.PI) : 1;
    const jit = busy ? Math.sin(now * 55) * 0.08 * r : 0;
    const hw = this.hw * pulse, hh = this.hh * pulse, x = this.uc + jit, y = this.vmid;
    g.fillStyle = theme.shadow; roundRect(g, x - hw + so[0], y - hh + so[1], 2 * hw, 2 * hh, 0.5 * r); g.fill();
    g.fillStyle = theme.mint; roundRect(g, x - hw, y - hh, 2 * hw, 2 * hh, 0.5 * r); g.fill();
    g.strokeStyle = theme.mintDk; g.lineWidth = 0.14 * r; g.stroke();
    g.fillStyle = theme.mintDk;
    circle(g, x + 0.15 * hw, y - 0.45 * r, 0.32 * r); g.fill();
    circle(g, x + 0.15 * hw, y + 0.45 * r, 0.32 * r); g.fill();
    g.fillStyle = busy && Math.sin(now * 20) > 0 ? theme.butter : theme.mintDk;
    circle(g, x - 0.55 * hw, y, 0.22 * r); g.fill();
  }
}

// spinner: wheel spins and flings the marble to a random lane
class Spinner extends Elem {
  constructor(col, a) {
    super(col, a, 3);
    this.rho = Math.min(0.32 * s, 0.2 * this.wd); this.C = [this.uc, this.vmid];
    const wr = this.rho + 2.2 * r, [cx, cy] = this.C;
    this.fin = []; this.fout = []; this.inP = []; this.feed = []; this.outP = [];
    for (let k = 0; k < 3; k++) {
      const dv = k - 1, fi = Math.PI - dv * 0.85, fo = dv * 0.8;
      const ci = [Math.cos(fi), Math.sin(fi)], co = [Math.cos(fo), Math.sin(fo)];
      const Wp = [cx + wr * ci[0], cy + wr * ci[1]], Pp = [cx + this.rho * ci[0], cy + this.rho * ci[1]];
      const Q = [cx + this.rho * co[0], cy + this.rho * co[1]];
      const d0 = Math.hypot(Wp[0] - this.u0, Wp[1] - this.lv(k)) * 0.45;
      const d1 = Math.hypot(this.u1 - Q[0], this.lv(k) - Q[1]) * 0.45;
      this.fin.push(fi); this.fout.push(fo);
      this.inP.push(this.P(bezPts([this.u0, this.lv(k)], [1, 0], Wp, [-ci[0], -ci[1]], d0, d0, 24),
        { p0: col, p1: col + 0.3, src: this.a + k, onEnd: m => this.arrive(m, k) }));
      this.feed.push(this.P(linePts(Wp, Pp, 6), { p0: col + 0.3, p1: col + 0.4, src: this.a + k, onEnd: m => this.capture(m, k) }));
      const op = this.P(bezPts(Q, co, [this.u1, this.lv(k)], [1, 0], d1, d1, 28), { p0: col + 0.6, p1: col + 1, onEnd: this.out(this.a + k) });
      op.events = [{ at: Math.min(op.len, 2.4 * r), fn: () => { this.busy = false; } }];
      this.outP.push(op);
    }
    this.busy = false; this.spin = null; this.ang = rng() * TAU;
  }
  outs() { return this.lanes(); }
  enter(m, lane) { setPath(m, this.inP[lane - this.a]); }
  arrive(m, k) { if (this.busy) return; this.busy = true; setPath(m, this.feed[k]); }
  capture(m, k) {
    if (this.spin) return;
    m.held = true;
    const out = Math.floor(Math.random() * 3);
    const d = ((this.fout[out] - this.fin[k]) % TAU + TAU) % TAU + TAU * (Math.random() < 0.4 ? 2 : 1);
    this.spin = { m, f0: this.fin[k], d, t0: now, dur: 0.7 + 0.35 * d / TAU, out, a0: this.ang, last: 0 };
  }
  update() {
    const sp = this.spin;
    if (!sp) return;
    const t = clamp((now - sp.t0) / sp.dur, 0, 1), e = easeOut(t), m = sp.m, f = sp.f0 + sp.d * e;
    this.ang = sp.a0 + sp.d * e;
    m.u = this.C[0] + this.rho * Math.cos(f); m.v = this.C[1] + this.rho * Math.sin(f);
    m.roll += (e - sp.last) * sp.d * this.rho / r; sp.last = e;
    if (now - sp.t0 > sp.dur + 0.15) { m.held = false; setPath(m, this.outP[sp.out]); this.spin = null; }
  }
  drawUnder(g) {
    const [cx, cy] = this.C, R0 = this.rho + 1.3 * r, so = localVec(2, 4);
    g.fillStyle = theme.shadow; circle(g, cx + so[0], cy + so[1], R0); g.fill();
    for (let j = 0; j < 6; j++) {
      g.fillStyle = j % 2 ? theme.butter : theme.butterLt;
      g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R0, this.ang + j * TAU / 6, this.ang + (j + 1) * TAU / 6); g.closePath(); g.fill();
    }
    g.strokeStyle = theme.butterDk; g.lineWidth = 0.14 * r; circle(g, cx, cy, R0); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.08)'; g.lineWidth = 2.1 * r; circle(g, cx, cy, this.rho); g.stroke();
    g.fillStyle = theme.butterDk; circle(g, cx, cy, 0.45 * r); g.fill();
  }
}

// flip-flop: alternates marbles between two lanes
class Flip extends Elem {
  constructor(col, a) {
    super(col, a, 2);
    const J = [this.uc - 0.1 * this.wd, this.vmid];
    this.J = J;
    this.inP = [0, 1].map(k => {
      const d = (J[0] - this.u0) * 0.5;
      return this.P(bezPts([this.u0, this.lv(k)], [1, 0], J, [1, 0], d, d, 24), { p0: col, p1: col + 0.5, src: this.a + k, onEnd: m => this.pass(m) });
    });
    this.outP = [0, 1].map(k => {
      const d = (this.u1 - J[0]) * 0.5;
      return this.P(bezPts(J, [1, 0], [this.u1, this.lv(k)], [1, 0], d, d, 28), { p0: col + 0.5, p1: col + 1, onEnd: this.out(this.a + k) });
    });
    this.state = rng() < 0.5 ? 0 : 1; this.shown = this.state; this.flipAt = 0;
    this.ang = this.target();
  }
  outs() { return this.lanes(); }
  target() { return this.shown === 0 ? 0.5 : -0.5; }
  enter(m, lane) { setPath(m, this.inP[lane - this.a]); }
  pass(m) { setPath(m, this.outP[this.state]); this.state ^= 1; this.flipAt = now + 0.3; }
  update(dt) {
    if (now >= this.flipAt) this.shown = this.state;
    this.ang += (this.target() - this.ang) * Math.min(1, dt * 14);
  }
  drawUnder(g) {
    const px = this.J[0] + 2.0 * r, py = this.J[1], len = 0.3 * this.wd;
    g.save(); g.translate(px, py); g.rotate(this.ang);
    g.fillStyle = theme.coral; roundRect(g, -0.32 * r, -0.32 * r, len, 0.64 * r, 0.32 * r); g.fill();
    g.restore();
    g.fillStyle = theme.coralDk; circle(g, px, py, 0.42 * r); g.fill();
  }
}

// funnel: marble spirals down and pops out the bottom
class Funnel extends Elem {
  constructor(col, a) {
    super(col, a, 2);
    this.rho = Math.min(0.36 * s, 0.22 * this.wd); this.C = [this.uc, this.vmid];
    const wr = this.rho + 2.2 * r, [cx, cy] = this.C, rho = this.rho;
    this.fin = [Math.PI + 0.6, Math.PI - 0.6]; this.dir = [1, -1];
    this.inP = []; this.feed = [];
    for (let k = 0; k < 2; k++) {
      const ci = [Math.cos(this.fin[k]), Math.sin(this.fin[k])];
      const Wp = [cx + wr * ci[0], cy + wr * ci[1]], Pp = [cx + rho * ci[0], cy + rho * ci[1]];
      const d0 = Math.hypot(Wp[0] - this.u0, Wp[1] - this.lv(k)) * 0.45;
      this.inP.push(this.P(bezPts([this.u0, this.lv(k)], [1, 0], Wp, [-ci[0], -ci[1]], d0, d0, 24),
        { p0: col, p1: col + 0.3, src: this.a + k, onEnd: m => this.arrive(m, k) }));
      this.feed.push(this.P(linePts(Wp, Pp, 6), { p0: col + 0.3, p1: col + 0.4, src: this.a + k, onEnd: m => this.capture(m, k) }));
    }
    this.outK = rng() < 0.5 ? 0 : 1;
    const d = (this.u1 - cx) * 0.5;
    const op = this.P(bezPts(this.C, [1, 0], [this.u1, this.lv(this.outK)], [1, 0], d, d, 28), {
      p0: col + 0.6, p1: col + 1, onEnd: this.out(this.a + this.outK),
      scale: sv => sv < rho ? 0.55 + 0.45 * sv / rho : 1,
      dark: sv => sv < rho ? 0.5 * (1 - sv / rho) : 0
    });
    op.events = [{ at: Math.min(op.len, rho + 2.2 * r), fn: () => { this.busy = false; } }];
    this.outP = op; this.busy = false; this.sp = null;
  }
  outs() { return [this.a + this.outK]; }
  enter(m, lane) { setPath(m, this.inP[lane - this.a]); }
  arrive(m, k) { if (this.busy) return; this.busy = true; setPath(m, this.feed[k]); }
  capture(m, k) { if (this.sp) return; m.held = true; this.sp = { m, k, t0: now, lastF: this.fin[k] }; }
  update() {
    const sp = this.sp;
    if (!sp) return;
    const t = clamp((now - sp.t0) / 1.7, 0, 1), m = sp.m;
    const rad = this.rho * Math.pow(1 - t, 0.9), f = this.fin[sp.k] + this.dir[sp.k] * 3.5 * Math.PI * Math.pow(t, 1.7);
    m.u = this.C[0] + rad * Math.cos(f); m.v = this.C[1] + rad * Math.sin(f);
    m.roll += Math.abs(f - sp.lastF) * rad / r; sp.lastF = f;
    m.scale = 1 - 0.45 * t; m.dark = 0.5 * t;
    if (t >= 1) { m.held = false; setPath(m, this.outP); this.sp = null; }
  }
  drawBase(g) {
    const [cx, cy] = this.C, R0 = this.rho + 1.15 * r, so = localVec(2, 4);
    g.fillStyle = theme.shadow; circle(g, cx + so[0], cy + so[1], R0); g.fill();
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, R0);
    gr.addColorStop(0, theme.lavDk); gr.addColorStop(1, theme.lav);
    g.fillStyle = gr; circle(g, cx, cy, R0); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 0.1 * r;
    for (const f of [0.35, 0.62, 0.85]) { circle(g, cx, cy, R0 * f); g.stroke(); }
    g.strokeStyle = theme.lavDk; g.lineWidth = 0.14 * r; circle(g, cx, cy, R0); g.stroke();
    g.fillStyle = 'rgba(0,0,0,0.55)'; circle(g, cx, cy, 0.5 * r); g.fill();
  }
}

// fuser: two marbles meet in a heart and become one
class Fuser extends Elem {
  constructor(col, a) {
    super(col, a, 2);
    const hk = 0.036 * s;
    this.hk = hk; this.HC = [this.uc - 0.06 * s, this.vmid];
    this.S = [0, 1].map(k => [this.HC[0] - 5 * hk, this.vmid + (k ? 1 : -1) * 7.5 * hk]);
    this.C = [this.HC[0] + 5 * hk, this.vmid];
    this.inP = [0, 1].map(k => {
      const d = (this.S[k][0] - this.u0) * 0.5;
      return this.P(bezPts([this.u0, this.lv(k)], [1, 0], this.S[k], [1, 0], d, d, 24), { p0: col, p1: col + 0.4, src: this.a + k, onEnd: m => this.arrive(m, k) });
    });
    this.outK = rng() < 0.5 ? 0 : 1;
    const d = (this.u1 - this.C[0]) * 0.5;
    const op = this.P(bezPts(this.C, [1, 0], [this.u1, this.lv(this.outK)], [1, 0], d, d, 28), { p0: col + 0.6, p1: col + 1, onEnd: this.out(this.a + this.outK) });
    op.events = [{ at: Math.min(op.len, 2.4 * r), fn: () => { this.busy = false; } }];
    this.outP = op; this.slot = [null, null]; this.since = [0, 0]; this.busy = false; this.fuse = null; this.glow = -9;
  }
  outs() { return [this.a + this.outK]; }
  enter(m, lane) { setPath(m, this.inP[lane - this.a]); }
  arrive(m, k) { if (this.slot[k] || this.busy) return; this.slot[k] = m; m.held = true; this.since[k] = now; }
  update() {
    const f = this.fuse;
    if (f) {
      const t = clamp((now - f.t0) / 0.45, 0, 1), e = easeInOut(t);
      f.ms.forEach((m, i) => { m.u = lerp(f.from[i][0], this.C[0], e); m.v = lerp(f.from[i][1], this.C[1], e); });
      if (t >= 1) {
        const [m, o] = f.ms;
        if (o) { m.mat = blendMat(m.mat, o.mat); o.dead = true; burst(this.C[0], this.C[1], m.mat, 16); this.glow = now; }
        m.held = false; setPath(m, this.outP); this.fuse = null;
      }
      return;
    }
    if (this.busy) return;
    const go = ms => { this.busy = true; this.slot = [null, null]; this.fuse = { ms, from: ms.map(m => [m.u, m.v]), t0: now }; };
    const [x, y] = this.slot;
    if (x && y) go([x, y]);
    else if (x && now - this.since[0] > 1.6) go([x]);
    else if (y && now - this.since[1] > 1.6) go([y]);
  }
  heart(g, k) {
    const hk = this.hk * k, [hu, hv] = this.HC;
    g.beginPath();
    for (let i = 0; i <= 64; i++) {
      const t = TAU * i / 64, x = 16 * Math.sin(t) ** 3;
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      if (i) g.lineTo(hu - y * hk, hv + x * hk); else g.moveTo(hu - y * hk, hv + x * hk);
    }
    g.closePath();
  }
  drawBase(g) {
    this.heart(g, 1);
    g.fillStyle = theme.pink; g.globalAlpha = 0.3; g.fill(); g.globalAlpha = 1;
    g.strokeStyle = theme.pink; g.lineWidth = 0.25 * r; g.stroke();
  }
  drawOver(g) {
    const dt = now - this.glow;
    if (dt > 0.6) return;
    this.heart(g, 1 + 0.15 * Math.sin(dt / 0.6 * Math.PI));

// collector: every lane drains toward its nearest end point
class Collector extends Elem {
  constructor(col) {
    super(col, 0, L);

  enter(m, lane) { setPath(m, this.p[lane]); }
}

// ---------- start / end points with iris shutters ----------
class Source {
  constructor(lane) {
    this.u = uSrc; this.v = laneV(lane); this.rot = rng() * TAU; this.open = 0; this.alpha = 0; this.seq = null;
    this.path = new Path(linePts([uSrc, this.v], [U1, this.v], 10), { p0: 0, p1: 1, onEnd: m => handoff(m, 1, lane) });
    this.next = now + 0.4 + Math.random() * 2.5;

  update() {
    const q = this.seq;

      return;
    }
    const t = now - q.t0;
    if (!q.close) {
      this.alpha = clamp(t / 0.3, 0, 1);
      this.open = easeInOut(clamp((t - 0.3) / 0.45, 0, 1));
      if (t >= 0.75 && !q.m) { q.m = makeMarble(this.u, this.v, MATS[0]); marbles.push(q.m); }
      if (!q.m) return;
      const k = clamp((t - 0.75) / 0.6, 0, 1), e = easeOut(k);
      if (k < 1) { q.m.scale = 0.3 + 0.7 * e; q.m.dark = 1 - e; q.m.clip = [this.u, this.v, this.open * Rs * 0.95]; }
      else if (q.m.held) { q.m.clip = null; q.m.held = false; setPath(q.m, this.path); }
      else if (q.m.dead || Math.hypot(q.m.u - this.u, q.m.v - this.v) > 2.4 * r) q.close = now;
    } else {
      const c = now - q.close;
      this.open = 1 - easeInOut(clamp(c / 0.45, 0, 1));
      this.alpha = 1 - clamp((c - 0.45) / 0.3, 0, 1);
      if (c > 0.75) { this.seq = null; this.next = now + 1.2 + Math.random() * 3.5; }

}

class Sink {
  constructor(lane) { this.u = uSink; this.v = laneV(lane); this.rot = rng() * TAU; this.open = 0; this.alpha = 0; this.m = null; }
  arrive(m) {
    if (this.m) return;
    this.m = m; m.held = true; this.t0 = now;
    // an earlier note still waiting by this exit heads for the slot now
    for (const q of notes) if (q.sink === this && now - q.t0 < 2.2) q.t0 = now - 2.2;
    notes.push(makeNote(this, m.tags));
  }
  update() {
    const m = this.m;

    const t = now - this.t0;
    this.alpha = clamp((t - 0.15) / 0.2, 0, 1) * (1 - clamp((t - 1.3) / 0.2, 0, 1));
    this.open = easeInOut(clamp((t - 0.35) / 0.3, 0, 1)) * (1 - easeInOut(clamp((t - 1.0) / 0.3, 0, 1)));

  }
}

function drawShutter(g, x, y, R, open, alpha, rot0) {
  if (alpha <= 0.005) return;
  g.save();
  g.globalAlpha = alpha;
  const Ro = R * 1.2;
  let gr = g.createRadialGradient(x - Ro * 0.35, y - Ro * 0.4, Ro * 0.1, x, y, Ro);
  gr.addColorStop(0, theme.ringHi); gr.addColorStop(1, theme.ringLo);
  g.fillStyle = gr; circle(g, x, y, Ro); g.fill();
  circle(g, x, y, R); g.clip();
  gr = g.createRadialGradient(x, y, 0, x, y, R);
  gr.addColorStop(0, '#000'); gr.addColorStop(1, theme.hole);
  g.fillStyle = gr; g.fillRect(x - R, y - R, 2 * R, 2 * R);
  if (open < 0.999) {
    const N = 7, rot = rot0 + (1 - open) * 1.4, a = open * R * 0.95 / Math.cos(Math.PI / N), U = [], V = [];
    for (let k = 0; k < N; k++) {
      const t = rot + k * TAU / N;
      U.push([Math.cos(t), Math.sin(t)]); V.push([x + a * Math.cos(t), y + a * Math.sin(t)]);
    }
    g.beginPath(); g.arc(x, y, R + 1, 0, TAU);
    g.moveTo(V[0][0], V[0][1]);
    for (let k = 1; k < N; k++) g.lineTo(V[k][0], V[k][1]);
    g.closePath();
    gr = g.createLinearGradient(x - R, y - R, x + R, y + R);
    gr.addColorStop(0, theme.blade1); gr.addColorStop(1, theme.blade0);
    g.fillStyle = gr; g.fill('evenodd');
    g.strokeStyle = theme.seam; g.lineWidth = Math.max(0.8, R * 0.06);
    for (let k = 0; k < N; k++) {
      const pu = U[(k + N - 1) % N], qu = U[k];
      let dx = qu[0] - pu[0], dy = qu[1] - pu[1];
      const l = Math.hypot(dx, dy); dx /= l; dy /= l;
      const px = V[k][0] - x, py = V[k][1] - y, b = px * dx + py * dy;
      const t = -b + Math.sqrt(Math.max(0, b * b - (px * px + py * py - 1.44 * R * R)));
      const ex = V[k][0] + dx * t, ey = V[k][1] + dy * t;
      const mx = (V[k][0] + ex) / 2 - dy * t * 0.18, my = (V[k][1] + ey) / 2 + dx * t * 0.18;
      g.beginPath(); g.moveTo(V[k][0], V[k][1]); g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
    }
  }
  g.restore();
}

// ---------- marble drawing (screen space) ----------
function drawMarble(g, x, y, R, mat, roll, specks) {
  const { kind, h, s: sa, l } = mat;
  if (kind === 'metal') {
    let gr = g.createRadialGradient(x - 0.3 * R, y - 0.35 * R, 0.05 * R, x, y, R);
    gr.addColorStop(0, '#fff'); gr.addColorStop(0.2, hsl(h, sa, l + 20)); gr.addColorStop(0.5, hsl(h, sa, l));
    gr.addColorStop(0.82, hsl(h, sa, l - 28)); gr.addColorStop(1, hsl(h, sa, l - 12));
    g.fillStyle = gr; circle(g, x, y, R); g.fill();
    g.save(); circle(g, x, y, R); g.clip();
    gr = g.createLinearGradient(x, y - R, x, y + R);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)');
    gr.addColorStop(0.54, hsl(h, sa, l - 45, 0.4)); gr.addColorStop(0.75, hsl(h, sa, l - 30, 0.12)); gr.addColorStop(1, hsl(h, sa, l + 15, 0.4));

    g.fillStyle = gr; circle(g, x, y, R); g.fill();

    g.translate(x, y); g.rotate(roll);
    g.strokeStyle = hsl(h + 35, sa, l + 32, 0.6); g.lineWidth = 0.17 * R; g.lineCap = 'round';
    for (let j = 0; j < 3; j++) {
      g.rotate(TAU / 3);
      g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(0.6 * R, -0.25 * R, 0.5 * R, 0.5 * R); g.stroke();
    }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    gr = g.createRadialGradient(x + 0.3 * R, y + 0.45 * R, 0, x + 0.3 * R, y + 0.45 * R, 0.55 * R);
    gr.addColorStop(0, hsl(h, sa, l + 38, 0.6)); gr.addColorStop(1, hsl(h, sa, l + 38, 0));

  const sa0 = kind === 'stone' ? 0.35 : 0.95;
  sp.addColorStop(0, `rgba(255,255,255,${sa0})`); sp.addColorStop(1, 'rgba(255,255,255,0)');

  g.strokeStyle = hsl(h, sa, l - 38, 0.45); g.lineWidth = Math.max(0.6, 0.05 * R);
  circle(g, x, y, R); g.stroke();
}
function drawMarbleObj(g, m) {
  if (!m.visible || m.dead) return;

  g.save();
  if (m.clip) {
    const [cx, cy] = toScreen(m.clip[0], m.clip[1]);
    circle(g, cx, cy, Math.max(0.01, m.clip[2])); g.clip();
  } else {

    gr.addColorStop(0, `rgba(${theme.shRGB},${a})`); gr.addColorStop(1, `rgba(${theme.shRGB},0)`);

// ---------- static layers ----------
function segsFor(p, layer) {
  if (layer === 'B') return p.elev.map(([a, b]) => p.slice(a, b));
  const ranges = p.gap ? [[0, p.gap[0]], [p.gap[1], p.len]] : [[0, p.len]];
  return ranges.map(([a, b]) => p.slice(a, b));
}
function strokeSegs(g, segs, width, color, off = [0, 0]) {
  if (!segs.length) return;
  g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = width; g.strokeStyle = color;
  g.beginPath();
  for (const pts of segs) {
    g.moveTo(pts[0][0] + off[0], pts[0][1] + off[1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0] + off[0], pts[i][1] + off[1]);
  }
  g.stroke();
}
function drawRails(g, segs, elevated) {
  const gauge = 0.95 * r, so = localVec(elevated ? 3 : 1.5, elevated ? 7 : 3);
  for (const pts of segs) {
    const A = offsetPts(pts, gauge), B = offsetPts(pts, -gauge);
    strokeSegs(g, [A, B], 0.4 * r, theme.shadow, so);
    g.strokeStyle = theme.tie; g.lineWidth = 0.35 * r; g.lineCap = 'round';
    let acc = 0;
    g.beginPath();
    for (let i = 1; i < pts.length; i++) {
      acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (acc >= 0.85 * r) { acc = 0; g.moveTo(A[i][0], A[i][1]); g.lineTo(B[i][0], B[i][1]); }
    }
    g.stroke();
    strokeSegs(g, [A, B], 0.38 * r, theme.rail);
  }
}
function makeLayer() {
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  return c;
}
function renderStatic() {
  layerA = makeLayer(); layerB = makeLayer();
  let g = layerA.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = theme.bg; g.fillRect(0, 0, W, H);
  g.fillStyle = theme.dot;
  for (let x = 11; x < W; x += 22) for (let y = 11; y < H; y += 22) g.fillRect(x - 0.75, y - 0.75, 1.5, 1.5);
  setLocal(g);
  const all = sources.map(q => q.path).concat(elements.flatMap(e => e.paths.filter(p => p.src == null || e.live.has(p.src))));
  const ch = all.filter(p => p.style === 'channel'), rl = all.filter(p => p.style === 'rails');
  const segA = ch.flatMap(p => segsFor(p, 'A'));
  strokeSegs(g, segA, 2.7 * r, theme.shadow, localVec(1.5, 3));
  strokeSegs(g, segA, 2.7 * r, theme.rim);
  strokeSegs(g, segA, 1.9 * r, theme.groove);
  strokeSegs(g, segA, 1.2 * r, theme.grooveIn);
  drawRails(g, rl.flatMap(p => segsFor(p, 'A')), false);
  for (const e of elements) e.drawBase(g);

  g = layerB.getContext('2d');
  setLocal(g);
  const segB = ch.flatMap(p => segsFor(p, 'B'));
  strokeSegs(g, segB, 2.8 * r, theme.shadow, localVec(3, 7));
  strokeSegs(g, segB, 3.0 * r, theme.edge);
  strokeSegs(g, segB, 2.7 * r, theme.rimHi);
  strokeSegs(g, segB, 1.9 * r, theme.groove);
  strokeSegs(g, segB, 1.2 * r, theme.grooveIn);
  drawRails(g, rl.flatMap(p => segsFor(p, 'B')), true);
}

// ---------- build ----------
const SPECIALS = [['loop', 1], ['bounce', 1], ['changer', 1], ['cross', 2], ['clone', 2], ['flip', 2], ['funnel', 2], ['fuser', 2], ['spinner', 3]];
const SPREADERS = new Set(['clone', 'flip', 'spinner', 'cross']);
const PAIRED = new Set(['cross', 'fuser']);
const CTOR = { loop: Loop, bounce: Bounce, changer: Changer, cross: Cross, clone: Clone, flip: Flip, funnel: Funnel, fuser: Fuser, spinner: Spinner };

function build() {
  layout();
  theme = THEMES[darkQuery.matches ? 'dark' : 'light'];
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  rng = mulberry32(seed);
  marbles = []; particles = []; notes = []; elements = []; grid = [];
  let bag = [];
  const refill = () => { bag = shuffle(SPECIALS.slice(), rng); };
  refill();
  // lanes that can actually carry marbles; no track is laid where nothing can arrive
  let reach = new Set(srcLanes);
  for (let col = 1; col <= K; col++) {
    grid[col] = [];
    const next = new Set();
    let i = 0;
    while (i < L) {
      const fits = ([t, n]) => {
        if (i + n > L) return false;
        const lanes = Array.from({ length: n }, (_, k) => i + k);
        return PAIRED.has(t) ? lanes.every(l => reach.has(l)) : lanes.some(l => reach.has(l));
      };
      // next to a dead lane, prefer an element that spreads traffic into it
      const mixed = ([t, n]) => fits([t, n]) && SPREADERS.has(t) && Array.from({ length: n }, (_, k) => reach.has(i + k)).includes(false);
      let e = null;
      if (rng() < 0.5 || bag.some(mixed)) {
        let idx = rng() < 0.75 ? bag.findIndex(mixed) : -1;
        if (idx < 0) idx = bag.findIndex(fits);
        if (idx >= 0) {
          const [t] = bag.splice(idx, 1)[0];
          if (!bag.length) refill();
          e = new CTOR[t](col, i);
        }
      }
      if (!e && reach.has(i)) e = new Track(col, i, rng() < 0.3);
      if (!e) { i++; continue; }
      e.live = new Set(e.lanes().filter(l => reach.has(l)));
      for (const l of e.outs(e.live)) next.add(l);
      for (let k = 0; k < e.n; k++) grid[col][i + k] = e;
      elements.push(e);
      i += e.n;
    }
    reach = next;
  }
  const used = new Set();
  for (const e of elements) {
    if (e instanceof Track) continue;
    let tag;
    do { tag = Array.from({ length: 3 }, () => String.fromCharCode(65 + Math.floor(rng() * 26))).join(''); } while (used.has(tag));
    used.add(tag); e.tag = tag;
  }
  sinkAt = {};
  sinks = sinkLanes.map(l => (sinkAt[l] = new Sink(l)));
  const collector = new Collector(K + 1);
  collector.live = reach;
  elements.push(collector);
  grid[K + 1] = Array(L).fill(collector);
  sources = srcLanes.map(l => new Source(l));
  renderStatic();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(layerA, 0, 0);
  setLocal(ctx);
  for (const e of elements) e.drawUnder(ctx);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const q of sources.concat(sinks)) {
    const [x, y] = toScreen(q.u, q.v);
    drawShutter(ctx, x, y, Rs, q.open, q.alpha, q.rot);
  }
  for (const m of marbles) if (!m.elev) drawMarbleObj(ctx, m);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(layerB, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const m of marbles) if (m.elev) drawMarbleObj(ctx, m);
  setLocal(ctx);
  for (const e of elements) e.drawOver(ctx);
  drawParticles(ctx);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawTags(ctx);
  drawNotes(ctx);
}

const tagFont = () => `600 ${Math.round(clamp(r * 0.8, 8, 11))}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
function pill(g, text, x, y, align, fg, alpha) {
  const fs = clamp(r * 0.8, 8, 11), tw = g.measureText(text).width, ph = fs * 1.6, pw = tw + fs;
  let x0 = align === 'right' ? x - pw : align === 'center' ? x - pw / 2 : x;
  x0 = clamp(x0, 4, W - pw - 4);
  const y0 = clamp(y - ph / 2, 4, H - ph - 4);
  g.globalAlpha = alpha;
  g.fillStyle = theme.tagBg; roundRect(g, x0, y0, pw, ph, ph / 2); g.fill();
  g.fillStyle = fg; g.fillText(text, x0 + fs / 2, y0 + ph / 2);
  g.globalAlpha = 1;
}
function drawTags(g) {
  g.font = tagFont(); g.textBaseline = 'middle'; g.textAlign = 'left';
  for (const e of elements) {
    if (!e.tag) continue;
    const k = clamp(1 - (now - e.lit) / 0.7, 0, 1);
    const [x, y] = toScreen(...e.tagPos());
    pill(g, e.tag, x, y, 'center', k > 0 ? theme.tagLit : theme.ink, 0.45 + 0.55 * k);
  }
}
// ---------- "That's why:" notes and the mail slot ----------
const HAND = '"Bradley Hand", "Segoe Print", "Comic Sans MS", cursive';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
const slot = () => { const w = Math.min(W - 48, 200); return { x: W - 16 - (w + 24) / 2, y: H - 16, w }; };

function makeNote(sink, tags) {
  const g = ctx, pad = 10, fsH = 15, fsB = 12, maxW = slot().w - 16 - 2 * pad;
  g.font = `600 ${fsB}px ${MONO}`;
  let lines = [];
  if (!tags.length) lines = ['just because'];
  for (const tag of tags) {
    const cur = lines.length ? lines[lines.length - 1] + ' → ' + tag : tag;
    if (lines.length && g.measureText(cur).width <= maxW) lines[lines.length - 1] = cur;
    else lines.push(lines.length ? '→ ' + tag : tag);
  }
  if (lines.length > 4) lines = ['…'].concat(lines.slice(-3));
  let tw = Math.max(...lines.map(l => g.measureText(l).width));
  g.font = `700 ${fsH}px ${HAND}`;
  tw = Math.max(tw, g.measureText("That's why:").width);
  const w = tw + 2 * pad, h = pad + fsH * 1.4 + lines.length * fsB * 1.55 + pad * 0.6;
  const jag = n => Array.from({ length: n + 1 }, () => Math.random() * 3);
  const n = Math.ceil(w / 7);
  const [sx, sy] = toScreen(sink.u, sink.v);
  let x0 = mode === 'lr' ? sx - 2.4 * r - w / 2 : sx, y0 = mode === 'lr' ? sy : sy - 2.6 * r - h / 2;
  x0 = clamp(x0, w / 2 + 6, W - w / 2 - 6); y0 = clamp(y0, h / 2 + 6, H - h / 2 - 40);
  return { sink, lines, w, h, fsH, fsB, pad, x0, y0, rot0: (Math.random() - 0.5) * 0.2, t0: now, jagT: jag(n), jagB: jag(n) };
}
function notePath(g, q) {
  const n = q.jagT.length - 1, x = -q.w / 2, y = -q.h / 2;
  g.beginPath();
  g.moveTo(x, y + q.jagT[0]);
  for (let i = 1; i <= n; i++) g.lineTo(x + q.w * i / n, y + q.jagT[i]);
  for (let i = n; i >= 0; i--) g.lineTo(x + q.w * i / n, y + q.h - q.jagB[i]);
  g.closePath();
}
function drawNotes(g) {
  const sl = slot();
  notes = notes.filter(q => now - q.t0 < 4.2);
  // brass mail slot
  const pw = sl.w + 24, ph = 22, fed = notes.some(q => now - q.t0 > 3.4);
  let gr = g.createLinearGradient(0, sl.y - ph / 2, 0, sl.y + ph / 2);
  gr.addColorStop(0, theme.brassHi); gr.addColorStop(1, theme.brassLo);
  g.fillStyle = theme.shadow; roundRect(g, sl.x - pw / 2 + 1, sl.y - ph / 2 + 2, pw, ph, 7); g.fill();
  g.fillStyle = gr; roundRect(g, sl.x - pw / 2, sl.y - ph / 2, pw, ph, 7); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.25)';
  for (const dx of [-pw / 2 + 7, pw / 2 - 7]) { circle(g, sl.x + dx, sl.y, 1.6); g.fill(); }
  g.fillStyle = fed ? '#000' : '#2a2116'; roundRect(g, sl.x - sl.w / 2, sl.y - 2.5, sl.w, 5, 2.5); g.fill();

  for (const q of notes) {
    const t = now - q.t0;
    let x = q.x0, y = q.y0, rot = q.rot0, sc = 1, a = 1;
    if (t < 0.35) { const e = easeOut(t / 0.35); sc = 0.6 + 0.4 * e; a = e; rot = q.rot0 * (2 - e); }
    else if (t >= 2.2) {
      const e = easeInOut(clamp((t - 2.2) / 1.2, 0, 1)), ty = sl.y - q.h / 2;
      x = lerp(q.x0, sl.x, e); y = lerp(q.y0, ty, e); rot = q.rot0 * (1 - e);
      if (t > 3.4) y = ty + q.h * Math.pow(clamp((t - 3.4) / 0.6, 0, 1), 2);
    }
    g.save();
    g.beginPath(); g.rect(0, 0, W, sl.y); g.clip();
    g.globalAlpha = a;
    g.translate(x, y); g.rotate(rot); g.scale(sc, sc);
    g.fillStyle = theme.shadow; g.translate(2, 3); notePath(g, q); g.fill(); g.translate(-2, -3);
    g.fillStyle = theme.paper; notePath(g, q); g.fill();
    g.save(); notePath(g, q); g.clip();
    g.strokeStyle = theme.paperLine; g.lineWidth = 1;
    const top = -q.h / 2 + q.pad + q.fsH * 1.4;
    for (let ly = top; ly < q.h / 2; ly += q.fsB * 1.55) { g.beginPath(); g.moveTo(-q.w / 2, ly); g.lineTo(q.w / 2, ly); g.stroke(); }
    g.restore();
    g.fillStyle = theme.paperInk; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.font = `700 ${q.fsH}px ${HAND}`;
    g.fillText("That's why:", -q.w / 2 + q.pad, top - q.fsH * 0.3);
    g.font = `600 ${q.fsB}px ${MONO}`;
    q.lines.forEach((l, i) => g.fillText(l, -q.w / 2 + q.pad, top + (i + 1) * q.fsB * 1.55 - q.fsB * 0.35));
    g.restore();
  }
}

let last = performance.now();
function frame(ts) {
  const dt = clamp((ts - last) / 1000, 0, 0.05);
  last = ts; now += dt;
  for (const q of sources) q.update();
  for (const e of elements) e.update(dt);
  for (const k of sinks) k.update();
  stepMarbles(dt);
  stepParticles(dt);
  draw();
  requestAnimationFrame(frame);
}

let resizeTimer = 0;
const rebuild = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(build, 150); };
addEventListener('resize', rebuild);
darkQuery.addEventListener('change', build);
build();
requestAnimationFrame(frame);
})();
</script>
</body>
